<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local AI</title>
<style>
:root{--bg:#212121;--side:#171717;--panel:#2b2b2b;--text:#ececec;--muted:#a1a1aa;--line:#383838;--accent:#8b7cff;--font:Inter;--size:15px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--size)/1.55 var(--font),system-ui,sans-serif;height:100vh;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 12px}button:hover{background:var(--panel)}.app{height:100vh;display:flex}
.sidebar{width:276px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:12px;flex-shrink:0}
.brand{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px;padding:4px 3px 10px}.brand small{font-weight:400;color:var(--muted);font-size:11px}
.primary{background:var(--accent);border:0;color:white;text-align:left;font-weight:600}.section-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;margin:8px 2px 3px}
.list{overflow:auto;display:flex;flex-direction:column;gap:3px}.item{display:flex;align-items:center;gap:8px;text-align:left;border:0;padding:8px 9px;border-radius:8px;color:#d4d4d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item.active{background:#303030;color:white}.item span{overflow:hidden;text-overflow:ellipsis}.project-item{font-size:13px}
.sidebar-bottom{margin-top:auto;display:grid;gap:8px}.muted{color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.topbar-title{font-weight:600}.top-actions{display:flex;gap:8px;align-items:center}.effort{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px}
.messages{flex:1;overflow:auto;padding:30px 20px 150px}.thread{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}.welcome{margin:auto;text-align:center;padding-top:14vh}.welcome h1{font-size:30px;letter-spacing:-.04em;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 0 28px}.msg{display:flex;gap:13px;align-items:flex-start}.avatar{width:30px;height:30px;border-radius:50%;background:#3b3b3b;display:grid;place-items:center;flex-shrink:0;font-size:12px}.msg.user .avatar{background:var(--accent);color:white}.bubble{min-width:0;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user .bubble{background:var(--panel);padding:11px 15px;border-radius:17px;max-width:85%}.msg.assistant .bubble{padding:3px 0}.composer-wrap{position:absolute;bottom:0;left:0;right:0;padding:25px 20px 18px;background:linear-gradient(transparent,var(--bg) 22%)}.composer{max-width:820px;margin:auto;background:var(--panel);border:1px solid #494949;border-radius:18px;padding:12px 14px;box-shadow:0 10px 35px #0003}.composer textarea{display:block;width:100%;resize:none;max-height:180px;min-height:54px;background:transparent;border:0;outline:0;padding:4px 2px}.composer-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.send{background:var(--accent);color:white;border:0;border-radius:10px;font-weight:700;padding:8px 14px}.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:9px}
.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(520px,100%);background:var(--side);border:1px solid var(--line);border-radius:16px;padding:20px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 16px;font-size:19px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px;outline:none}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.empty{color:var(--muted);font-size:12px;padding:5px}
@media(max-width:720px){.sidebar{width:215px;padding:10px}.topbar{padding:0 12px}.messages{padding:22px 13px 145px}.composer-wrap{padding:18px 12px 12px}}
@media(max-width:540px){.sidebar{width:58px;padding:8px}.brand{font-size:0}.brand:after{content:"L";font-size:18px}.sidebar .primary,.sidebar .section-head,.sidebar .item span,.sidebar .sidebar-bottom .label{display:none}.sidebar .item{justify-content:center}.sidebar .item:before{content:"•";font-size:18px}.sidebar-bottom button{font-size:0}.sidebar-bottom button:after{content:"⚙";font-size:16px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">Local AI <small>PRIVATE</small></div>
  <button class="primary" id="newChat">＋　New chat</button>
  <div>
    <div class="section-head">PROJECTS <button id="addProject" style="padding:2px 7px">＋</button></div>
    <div id="projects" class="list"><div class="empty">No projects yet</div></div>
  </div>
  <div style="min-height:0;display:flex;flex-direction:column;flex:1">
    <div class="section-head">RECENT CHATS <button id="searchToggle" style="padding:2px 7px">⌕</button></div>
    <input id="search" placeholder="Search chats..." style="display:none;background:var(--panel);border:1px solid var(--line);padding:8px;border-radius:8px;margin-bottom:5px">
    <div id="chats" class="list"></div>
  </div>
  <div class="sidebar-bottom"><button id="settingsBtn">⚙　<span class="label">Settings</span></button></div>
</aside>
<main class="main">
  <header class="topbar"><div class="topbar-title" id="chatTitle">New chat</div><div class="top-actions"><select class="effort" id="effort" title="Reasoning effort"><option value="low">Effort: Low</option><option value="medium" selected>Effort: Medium</option><option value="high">Effort: High</option></select><button id="renameBtn" title="Rename chat">✎</button><button id="deleteBtn" title="Delete chat">⌫</button></div></header>
  <section class="messages" id="messages"><div class="welcome"><h1>What are we working on?</h1><p>Your private AI. Running locally.</p></div></section>
  <div class="composer-wrap"><div class="composer"><textarea id="prompt" placeholder="Message Local AI..." rows="2"></textarea><div class="composer-foot"><span>Qwen3-4B · Local model</span><button class="send" id="send">Send ↑</button></div></div><div class="hint">Your chats are stored locally on this computer.</div></div>
</main>
</div>
<div class="overlay" id="overlay"><div class="modal"><h2 id="modalTitle">Settings</h2><div id="modalBody"></div><div class="modal-actions"><button id="cancelModal">Cancel</button><button class="send" id="saveModal">Save</button></div></div></div>
<script>
let currentChat=null, currentProject=null, settings={}, modalSave=null, busy=false;
const $=id=>document.getElementById(id);
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||r.statusText);return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderText(s){let x=esc(s);x=x.replace(/```([\w+-]*)\n([\s\S]*?)```/g,(_,lang,code)=>`<pre style="background:#151515;padding:13px;border-radius:10px;overflow:auto"><code>${code}</code></pre>`);x=x.replace(/`([^`]+)`/g,'<code style="background:#444;padding:2px 5px;border-radius:4px">$1</code>');x=x.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');return x}
function addMessage(role,content){const wrap=document.createElement('div');wrap.className='msg '+role;wrap.innerHTML=`<div class="avatar">${role==='user'?'You':'AI'}</div><div class="bubble">${renderText(content)}</div>`;$('messages').appendChild(wrap);$('messages').scrollTop=$('messages').scrollHeight}
function setWelcome(){ $('messages').innerHTML='<div class="welcome"><h1>What are we working on?</h1><p>Your private AI. Running locally.</p></div>'; }
async function loadChats(){const chats=await api('/api/chats');$('chats').innerHTML='';if(!chats.length){$('chats').innerHTML='<div class="empty">No chats yet</div>';return}for(const c of chats){const b=document.createElement('button');b.className='item'+(c.id===currentChat?' active':'');b.innerHTML=`<span>▤　${esc(c.title)}</span>`;b.title=c.title;b.onclick=()=>openChat(c.id);$('chats').appendChild(b)}}
async function loadProjects(){const ps=await api('/api/projects');$('projects').innerHTML='';if(!ps.length){$('projects').innerHTML='<div class="empty">No projects yet</div>';return}for(const p of ps){const b=document.createElement('button');b.className='item project-item';b.innerHTML=`<span>▰　${esc(p.name)}</span>`;b.onclick=()=>{currentProject=p.id;newChat()};b.title=p.instructions||p.name;$('projects').appendChild(b)}}
async function newChat(){const c=await api('/api/chats',{method:'POST',body:JSON.stringify({project_id:currentProject})});currentChat=c.id;$('chatTitle').textContent='New chat';setWelcome();await loadChats();$('prompt').focus()}
async function openChat(id){const d=await api('/api/chats/'+id);currentChat=id;currentProject=d.chat.project_id;$('chatTitle').textContent=d.chat.title;$('messages').innerHTML='';if(!d.messages.length)setWelcome();for(const m of d.messages)addMessage(m.role,m.content);await loadChats()}
async function send(){const text=$('prompt').value.trim();if(!text||busy)return;if(!currentChat)await newChat();busy=true;$('send').disabled=true;$('send').textContent='Thinking…';$('prompt').value='';if($('messages').querySelector('.welcome'))$('messages').innerHTML='';addMessage('user',text);const pending=document.createElement('div');pending.className='msg assistant';pending.id='pending';pending.innerHTML='<div class="avatar">AI</div><div class="bubble muted">Thinking…</div>';$('messages').appendChild(pending);try{const d=await api(`/api/chats/${currentChat}/messages`,{method:'POST',body:JSON.stringify({content:text,effort:$('effort').value})});pending.remove();addMessage('assistant',d.answer);const chat=await api('/api/chats/'+currentChat);$('chatTitle').textContent=chat.chat.title;await loadChats()}catch(e){pending.remove();addMessage('assistant','Error: '+e.message)}finally{busy=false;$('send').disabled=false;$('send').textContent='Send ↑';$('prompt').focus()}}
$('send').onclick=send;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('newChat').onclick=()=>{currentProject=null;newChat()};$('addProject').onclick=()=>projectModal();$('settingsBtn').onclick=()=>settingsModal();$('renameBtn').onclick=async()=>{if(!currentChat)return;const title=prompt('New chat title:',$('chatTitle').textContent);if(title){await api('/api/chats/'+currentChat,{method:'PATCH',body:JSON.stringify({title})});$('chatTitle').textContent=title;loadChats()}};\n$('deleteBtn').onclick=async()=>{if(!currentChat)return;if(confirm('Delete this chat and its messages?')){await api('/api/chats/'+currentChat,{method:'DELETE'});currentChat=null;currentProject=null;$('chatTitle').textContent='New chat';setWelcome();await loadChats()}};
$('searchToggle').onclick=()=>{$('search').style.display=$('search').style.display==='none'?'block':'none';$('search').focus()};
$('search').oninput=async()=>{const q=$('search').value.trim();if(!q){loadChats();return}const rows=await api('/api/search?q='+encodeURIComponent(q));$('chats').innerHTML='';for(const c of rows){const b=document.createElement('button');b.className='item';b.textContent='▤　'+c.title;b.onclick=()=>openChat(c.id);$('chats').appendChild(b)}};
function showModal(title,body,save){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;modalSave=save;$('overlay').style.display='flex'}
function closeModal(){$('overlay').style.display='none';modalSave=null}
$('cancelModal').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};$('saveModal').onclick=async()=>{try{if(modalSave)await modalSave();closeModal()}catch(e){alert(e.message)}};
function projectModal(){showModal('Create project',`<div class="field"><label>Project name</label><input id="pname" placeholder="e.g. AI development"></div><div class="field"><label>Project instructions (optional)</label><textarea id="pinst" placeholder="What should the assistant know about this project?"></textarea></div>`,async()=>{await api('/api/projects',{method:'POST',body:JSON.stringify({name:$('pname').value,instructions:$('pinst').value})});await loadProjects()})}
async function settingsModal(){settings=await api('/api/settings');showModal('Settings',`
<div class="field"><label>Appearance</label><select id="stheme"><option value="dark">Dark</option><option value="light">Light</option></select></div>
<div class="field"><label>Accent color</label><input id="saccent" type="color"></div>
<div class="field"><label>Font</label><select id="sfont"><option>Inter</option><option>Arial</option><option>Georgia</option><option>system-ui</option><option>monospace</option></select></div>
<div class="field"><label>Font size</label><select id="ssize"><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>20</option></select></div>
<div class="field"><label>Default effort</label><select id="seffort"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>`,async()=>{const s={theme:$('stheme').value,accent:$('saccent').value,font:$('sfont').value,font_size:$('ssize').value,effort:$('seffort').value};await api('/api/settings',{method:'PATCH',body:JSON.stringify(s)});applySettings(s) });$('stheme').value=settings.theme;$('saccent').value=settings.accent;$('sfont').value=settings.font;$('ssize').value=settings.font_size;$('seffort').value=settings.effort}
function applySettings(s){settings=s;const light=s.theme==='light';document.documentElement.style.setProperty('--bg',light?'#f7f7f8':'#212121');document.documentElement.style.setProperty('--side',light?'#eeeeef':'#171717');document.documentElement.style.setProperty('--panel',light?'#e8e8eb':'#2b2b2b');document.documentElement.style.setProperty('--text',light?'#202024':'#ececec');document.documentElement.style.setProperty('--muted',light?'#666':'#a1a1aa');document.documentElement.style.setProperty('--line',light?'#d4d4d8':'#383838');document.documentElement.style.setProperty('--accent',s.accent);document.documentElement.style.setProperty('--font',s.font);document.documentElement.style.setProperty('--size',s.font_size+'px');$('effort').value=s.effort}
async function init(){try{const s=await api('/api/settings');applySettings(s);await loadProjects();await loadChats()}catch(e){alert('Could not start Local AI: '+e.message)}}
init();
</script>
</body></html>
