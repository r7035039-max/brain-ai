<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brain Mini</title><style>
:root{--bg:#212121;--side:#171717;--panel:#2b2b2b;--text:#ececec;--muted:#a1a1aa;--line:#383838;--accent:#8b7cff;--font:Inter;--size:15px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--size)/1.55 var(--font),system-ui,sans-serif;height:100vh;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 12px}button:hover{background:var(--panel)}.app{height:100vh;display:flex}
.sidebar{width:276px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:12px;flex-shrink:0}
.brand{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px;padding:4px 3px 10px}.brand small{font-weight:400;color:var(--muted);font-size:11px}
.primary{background:var(--accent);border:0;color:white;text-align:left;font-weight:600}.section-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;margin:8px 2px 3px}
.list{overflow:auto;display:flex;flex-direction:column;gap:3px}.item{display:flex;align-items:center;gap:8px;text-align:left;border:0;padding:8px 9px;border-radius:8px;color:#d4d4d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item.active{background:#303030;color:white}.item span{overflow:hidden;text-overflow:ellipsis}.project-item{font-size:13px}
.sidebar-bottom{margin-top:auto;display:grid;gap:8px}.muted{color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.topbar-title{font-weight:600}.top-actions{display:flex;gap:8px;align-items:center}.effort{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px}
.messages{flex:1;overflow:auto;padding:30px 20px 150px}.thread{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}.welcome{margin:auto;text-align:center;padding-top:14vh}.welcome h1{font-size:30px;letter-spacing:-.04em;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 0 28px}.msg{display:flex;gap:13px;align-items:flex-start}.avatar{width:30px;height:30px;border-radius:50%;background:#3b3b3b;display:grid;place-items:center;flex-shrink:0;font-size:12px}.msg.user .avatar{background:var(--accent);color:white}.bubble{min-width:0;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user .bubble{background:var(--panel);padding:11px 15px;border-radius:17px;max-width:85%}.msg.assistant .bubble{padding:3px 0}.composer-wrap{position:absolute;bottom:0;left:0;right:0;padding:25px 20px 18px;background:linear-gradient(transparent,var(--bg) 22%)}.composer{max-width:820px;margin:auto;background:var(--panel);border:1px solid #494949;border-radius:18px;padding:12px 14px;box-shadow:0 10px 35px #0003}.composer textarea{display:block;width:100%;resize:none;max-height:180px;min-height:54px;background:transparent;border:0;outline:0;padding:4px 2px}.composer-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.send{background:var(--accent);color:white;border:0;border-radius:10px;font-weight:700;padding:8px 14px}.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:9px}
.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(520px,100%);background:var(--side);border:1px solid var(--line);border-radius:16px;padding:20px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 16px;font-size:19px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px;outline:none}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.empty{color:var(--muted);font-size:12px;padding:5px}
@media(max-width:720px){.sidebar{width:215px;padding:10px}.topbar{padding:0 12px}.messages{padding:22px 13px 145px}.composer-wrap{padding:18px 12px 12px}}
@media(max-width:540px){.sidebar{width:58px;padding:8px}.brand{font-size:0}.brand:after{content:"L";font-size:18px}.sidebar .primary,.sidebar .section-head,.sidebar .item span,.sidebar .sidebar-bottom .label{display:none}.sidebar .item{justify-content:center}.sidebar .item:before{content:"•";font-size:18px}.sidebar-bottom button{font-size:0}.sidebar-bottom button:after{content:"⚙";font-size:16px}}

:root{--accent:#94f189;--font:system-ui} .primary,.send{color:#162017}.sidebar{width:260px}.brand{font-size:22px;letter-spacing:-1px}.brand small{letter-spacing:1px}.messages{padding-bottom:30px}.composer-wrap{position:static;background:var(--bg);padding-top:8px}.thread{max-width:780px}.msg{display:block}.msg.user{align-self:flex-end;max-width:85%}.msg.user .bubble{max-width:100%}.msg.assistant{width:100%}.bubble{white-space:normal}.prose{white-space:pre-wrap}.msg-label{font-size:12px;color:var(--muted);margin-bottom:8px}.msg.user .msg-label{display:none}.welcome{padding-top:10vh}.welcome h1{font-size:38px;font-weight:550}.spark{color:var(--accent);font-size:48px;margin-bottom:18px}.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:25px}.cards button{text-align:left;width:210px;padding:18px;color:var(--text)}.cards small{display:block;color:var(--muted);margin-top:7px}.status{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e5b76d;margin-right:7px}.dot.online{background:var(--accent)}pre{background:var(--side);border:1px solid var(--line);padding:16px;border-radius:0 0 12px 12px;overflow:auto;margin:0 0 12px;white-space:pre;font-size:13px}.code-head{background:var(--side);padding:7px 12px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.code-head span{margin-right:auto}.code-head button,.mini{padding:4px 8px;font-size:12px}.tools{display:flex;gap:7px;margin-top:12px}.tools button{color:var(--muted);font-size:12px;padding:4px 8px}.item{color:var(--text);flex-shrink:0}.item.active{background:var(--panel);color:var(--text)}.side-list{flex:1;min-height:0;overflow:auto}.sidebar-bottom{border-top:1px solid var(--line);padding-top:12px}.composer textarea{min-height:65px}.composer-foot{gap:8px;flex-wrap:wrap}.composer-foot select{background:transparent;border:0;padding:6px;font-size:12px}.composer-foot option{background:var(--panel)}#files{max-width:820px;margin:0 auto 8px;display:flex;gap:6px;flex-wrap:wrap}details{font-size:13px;color:var(--muted);margin:12px 0}details .prose{padding:12px;border-left:2px solid var(--line)}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#51342b;color:#fff;border-radius:12px;z-index:50;max-width:80%;display:none}.preview-modal{width:min(1100px,96vw)}iframe{background:white;width:100%;height:65vh;border:0;border-radius:10px}button:disabled{opacity:.4;cursor:default}.subtle{font-size:11px;color:var(--muted)}.topbar{border-bottom:0}.section-head{margin-top:18px}.field input:focus,.field textarea:focus{border-color:var(--accent)}.projectbar{color:var(--accent);font-size:12px}.empty{padding:10px}a{color:var(--accent)}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">✳ brain <small>MINI / LOCAL</small></div><button class="primary" id="newChat">＋　Новый чат</button><input id="search" placeholder="Поиск чатов…" aria-label="Поиск чатов" style="background:var(--panel);border:0;border-radius:9px;padding:10px;min-width:0"><div class="side-list"><div class="section-head">ПРОЕКТЫ <button class="mini" id="addProject">＋</button></div><div id="projects" class="list"></div><div class="section-head">ЧАТЫ</div><div id="chats" class="list"></div></div><div class="sidebar-bottom"><span class="status" id="connection"><i class="dot"></i>Проверка модели…</span><button id="settingsBtn">⚙　Настройки</button><span class="subtle">brain_ai_29999elo · на твоём компьютере</span></div></aside><main class="main"><header class="topbar"><div><span id="chatTitle">Brain Mini</span><div class="projectbar" id="projectLabel"></div></div><div class="top-actions"><button id="pinBtn" title="Закрепить">☆</button><button id="renameBtn" title="Переименовать">✎</button><button id="exportBtn" title="Экспорт чата">↓</button><button id="deleteBtn" title="Удалить">⌫</button></div></header><section class="messages" id="messages"><div class="thread" id="thread"></div></section><div class="composer-wrap"><div id="files"></div><div class="composer"><textarea id="prompt" aria-label="Сообщение" placeholder="Спроси что-нибудь или опиши, что хочешь создать…" rows="2"></textarea><div class="composer-foot"><div><button id="attachBtn" class="mini" title="Добавить текстовый файл">＋ Файл</button><select id="mode" aria-label="Режим"><option value="chat">✳ Чат</option><option value="agents">◈ Команда агентов</option></select></div><span id="status" class="status"></span><button class="send" id="send">Отправить ↑</button></div></div><div class="hint">Enter — отправить · Shift + Enter — новая строка · ответы модели нужно проверять</div></div></main></div><input type="file" id="fileInput" hidden accept=".txt,.md,.json,.py,.js,.html,.css,.csv,.sql,.ts,.tsx,.yaml,.yml"><div class="toast" id="toast"></div><div class="overlay" id="overlay"><div class="modal" id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modal-actions"><button id="cancelModal">Закрыть</button><button class="send" id="saveModal">Сохранить</button></div></div></div><script>const TOKEN='__TOKEN__';</script><script src="/app.js"></script></body></html>
